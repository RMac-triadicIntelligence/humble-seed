name: Validate Humble Seed

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the primary snapshot
        run: python -m pip install .
      - name: Verify supplied sources
        run: python tools/verify_sources.py
      - name: Run assertion-based checks
        run: python -m unittest discover -s tests -v
      - name: Execute every matched demo and probe
        run: python run.py all
